<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../week-01/src/urbanist-local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:Urbanist,sans-serif;background:#20231e}
.bg{position:absolute;inset:-60px;background:url(bg-frame.jpg) center/cover;filter:blur(38px) brightness(.55) saturate(1.1)}
.top{position:absolute;top:70px;left:0;right:0;text-align:center;color:#f9f2e2}
.kicker{font-weight:700;font-size:30px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
h1{margin-top:18px;font-weight:800;font-size:84px;line-height:.98;letter-spacing:-.03em}
h1 em{font-style:normal;color:#b9c9ab}
.card{position:absolute;border-radius:34px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45);border:0px solid #fff}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.c1{left:70px;top:330px;width:470px;height:380px}
.c2{left:470px;top:410px;width:540px;height:400px;z-index:2}
.c3{left:90px;top:690px;width:440px;height:330px;z-index:3}
.c4{left:440px;top:780px;width:520px;height:390px;z-index:4}
.bottom{position:absolute;left:70px;right:70px;bottom:62px;display:flex;justify-content:space-between;align-items:flex-end;color:#f9f2e2}
.sub{font-size:38px;line-height:1.15;font-weight:500}
.sub b{font-weight:800}
.watch{font-size:40px;font-weight:300;text-align:right;line-height:1}
.watch svg{display:block;margin:10px 0 0 auto}
</style></head><body>
<div class="bg"></div>
<div class="top">
  <div class="kicker">Lights On · new template</div>
  <h1>These are just<br>the <em>listing photos.</em></h1>
</div>
<div class="card c1"><img src="photos/01.jpg"></div>
<div class="card c2"><img src="photos/02.jpg"></div>
<div class="card c3"><img src="photos/03.jpg"></div>
<div class="card c4"><img src="photos/04.jpg"></div>
<div class="bottom">
  <div class="sub"><b>Daytime photos in.</b><br>Swipe to see the video.</div>
  <div class="watch">Watch this<svg width="150" height="30" viewBox="0 0 150 30"><path d="M2 15H144M130 3l14 12-14 12" stroke="#f9f2e2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
</body></html>
