<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../week-01/src/urbanist-local.css">
<style>
:root{--char:#20231e;--cream:#f9f1e2;--sage:#9cac90;--sage-d:#71845f}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:Urbanist,sans-serif;background:var(--char)}
.photo{position:absolute;left:0;right:0;top:0;height:1060px;background:url('../../../../prompt seven picture day/images/04-living-room.png') center 60%/cover}
.shade{position:absolute;left:0;right:0;top:0;height:1060px;background:radial-gradient(ellipse 90% 55% at 50% 30%,rgba(10,12,9,.62),rgba(10,12,9,0) 78%)}
.text{position:absolute;left:70px;right:70px;top:150px;text-align:center;color:#fff;font-weight:800;font-size:104px;line-height:.98;letter-spacing:-.03em;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.mk{position:relative;display:inline-block;color:var(--char);text-shadow:none}
.mk:before{content:"";position:absolute;left:-.08em;right:-.08em;top:.1em;bottom:.02em;background:var(--sage);border-radius:.08em;z-index:-1}
.text span{position:relative;z-index:0}
.band{position:absolute;left:0;right:0;bottom:0;height:290px;background:var(--cream);display:flex;align-items:center;justify-content:space-between;padding:0 70px}
.logo{width:290px;height:120px;overflow:hidden;position:relative}.logo img{position:absolute;width:520px;left:-115px;top:-200px}
.band .r{text-align:right}
.band .r b{display:block;color:var(--char);font-size:40px;font-weight:800;letter-spacing:-.01em}
.band .r span{display:inline-block;margin-top:16px;background:var(--sage-d);color:#fff;font-weight:700;font-size:32px;padding:14px 28px;border-radius:999px}
</style>
<div class="photo"></div><div class="shade"></div>
<div class="text"><span>Buyers don't stop<br>for rooms.<br>They stop for a<br><span class="mk">feeling.</span></span></div>
<div class="band"><div class="logo"><img src="../../../../public/brand/official/homie-wordmark-dark-on-cream.png"></div>
<div class="r"><b>Turn listing photos<br>into a home tour.</b><span>Try free · link in bio</span></div></div>
