<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../week-01/src/urbanist-local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Urbanist,sans-serif}
.card{position:absolute;inset:0;background:rgb(249,241,226);transform:translateY(100%);animation:push .5s cubic-bezier(.16,1,.3,1) 0s forwards;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:230px 70px 420px}
@keyframes push{to{transform:translateY(0)}}
.mark{width:560px;opacity:0;animation:fade .5s ease .35s forwards}
@keyframes fade{to{opacity:1}}
.lines{margin-top:20px;text-align:center;color:#20231e;font-weight:800;font-size:118px;line-height:.98;letter-spacing:-.03em}
.l{display:block;overflow:hidden;padding:0 .05em .06em}
.w{display:inline-block;transform:translateY(105%);animation:rise .5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rise{to{transform:translateY(0)}}
.hl{position:relative;display:inline-block;padding:0 .12em}
.hl::before{content:"";position:absolute;inset:.08em 0 .02em;background:#9cac90;border-radius:14px;transform:scaleX(0);transform-origin:left;animation:swipe .35s cubic-bezier(.16,1,.3,1) 1.25s forwards;z-index:-1}
.hl span{position:relative}
@keyframes swipe{to{transform:scaleX(1)}}
.pill{margin-top:96px;background:#71845f;color:#f9f2e2;font-weight:700;font-size:46px;padding:26px 56px;border-radius:999px;opacity:0;transform:translateY(30px);animation:up .45s cubic-bezier(.16,1,.3,1) 1.55s forwards}
@keyframes up{to{opacity:1;transform:translateY(0)}}
.handle{margin-top:34px;color:#20231e;opacity:0;font-weight:700;font-size:36px;animation:fade .4s ease 1.75s forwards}
</style></head><body>
<div class="card">
  <img class="mark" src="../../../../public/brand/official/homie-wordmark-dark-on-cream.png">
  <div class="lines">
    <span class="l"><span class="w" style="animation-delay:.55s">Make</span> <span class="w" style="animation-delay:.62s">your</span> <span class="w" style="animation-delay:.69s">first</span></span>
    <span class="l"><span class="w" style="animation-delay:.76s">video</span> <span class="w" style="animation-delay:.83s">for</span> <span class="w" style="animation-delay:.90s">only</span></span>
    <span class="l"><span class="w" style="animation-delay:.97s"><span class="hl"><span>$1</span></span></span></span>
  </div>
  <div class="pill">try-homie.com</div>
  <div class="handle">@homie.app.ai</div>
</div>
</body></html>
