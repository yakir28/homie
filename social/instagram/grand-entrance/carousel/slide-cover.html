<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../week-01/src/urbanist-local.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;font-family:Urbanist,sans-serif;background:#2a2b29}
.bg{position:absolute;inset:0;background:url(photos/01.jpg) center 60%/cover}
